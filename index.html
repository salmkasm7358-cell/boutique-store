<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="Qy90kw9KL1jZst7Dns2FHTv-VKjBss3w8-71Ajx3OYo" />
    <title>بوتيك السعادة | متجر مستلزمات الأزواج</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --bg-dark: #050505; --bg-card: #0f0f0f; --pink: #e91e63; --pink-dark: #ad1457; --gold: #d4af37; --text-main: #ffffff; --text-muted: #aaaaaa; --border-color: #2a2a2a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 80px; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; } ul { list-style: none; }
        
        .top-bar { background: linear-gradient(90deg, #000, #1a0a15, #000); color: var(--pink); text-align: center; padding: 8px; font-size: 12px; border-bottom: 1px solid var(--pink-dark); }
        header { position: sticky; top: 0; z-index: 1000; background: rgba(5,5,5,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--gold); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .logo-text { font-size: 24px; font-weight: 900; color: var(--gold); font-family: 'Times New Roman', serif; text-shadow: 0 0 10px rgba(212,175,55,0.5); }
        .logo-sub { font-size: 10px; color: var(--pink); display: block; text-align: center; }
        .header-left { display: flex; gap: 15px; align-items: center; font-size: 20px; color: var(--gold); }
        .cart-icon { position: relative; cursor: pointer; }
        .cart-badge { position: absolute; top: -8px; left: -8px; background: var(--pink); color: white; font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .menu-btn { cursor: pointer; }

        .side-menu { position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: var(--bg-card); z-index: 2000; transition: 0.3s; border-left: 1px solid var(--gold); padding: 20px; overflow-y: auto; }
        .side-menu.active { right: 0; }
        .side-menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1999; display: none; }
        .side-menu-overlay.active { display: block; }
        .side-menu h3 { color: var(--gold); margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .side-menu ul li { padding: 12px 0; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #ddd; transition: 0.3s; font-size: 14px; }

        .page-section { display: none; animation: fadeIn 0.4s ease; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .dynamic-banner-container { width: 100%; min-height: 200px; background: #000; position: relative; border-bottom: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .dynamic-banner-container img { width: 100%; height: auto; max-height: 400px; object-fit: contain; display: block; }
        
        .btn { padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; font-family: inherit; transition: 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }
        .btn-pink { background: linear-gradient(135deg, var(--pink), var(--pink-dark)); color: white; box-shadow: 0 4px 15px rgba(233,30,99,0.4); }
        .btn-outline { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
        
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 15px; padding: 20px 5%; }
        .category-item { text-align: center; cursor: pointer; }
        .category-icon { width: 75px; height: 75px; margin: 0 auto 8px; border-radius: 50%; border: 2px solid var(--gold); background: var(--bg-card); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .category-icon img { width: 100%; height: 100%; object-fit: cover; }
        .category-item h4 { font-size: 11px; color: #ddd; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 20px 5%; }
        .product-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: 0.3s; }
        .product-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .product-img { height: 160px; background: #1a1a1a; position: relative; }
        .product-img img { width: 100%; height: 100%; object-fit: cover; }
        .product-info { padding: 12px; text-align: center; flex: 1; }
        .product-info h4 { font-size: 13px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stars { color: var(--gold); font-size: 11px; margin-bottom: 5px; }
        .price { color: var(--pink); font-weight: bold; font-size: 15px; margin-bottom: 10px; }
        .product-actions { display: flex; gap: 5px; padding: 0 10px 10px; }
        .product-actions button { flex: 1; padding: 8px; font-size: 11px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-add { background: #222; color: var(--gold); border: 1px solid var(--gold) !important; }
        .btn-buy { background: var(--pink); color: white; }

        .cart-item { display: flex; gap: 15px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; margin-bottom: 15px; align-items: center; }
        .cart-item img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; }
        .cart-item-info { flex: 1; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: var(--gold); }
        .form-group input { width: 100%; padding: 12px; background: #111; border: 1px solid var(--border-color); border-radius: 8px; color: white; font-family: inherit; }
        .menu-list { padding: 0 5%; }
        .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; margin-bottom: 10px; cursor: pointer; }
        .menu-item:hover { border-color: var(--gold); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0a0a0a; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1500; }
        .nav-item { text-align: center; color: #777; font-size: 11px; cursor: pointer; width: 20%; }
        .nav-item i { display: block; font-size: 20px; margin-bottom: 3px; }
        .nav-item.active { color: var(--pink); }
        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--pink); color: white; padding: 12px 25px; border-radius: 50px; font-weight: bold; z-index: 3000; opacity: 0; transition: 0.3s; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .container { padding: 0 5%; }
        .empty-state { text-align: center; padding: 40px; color: #777; }
    </style>
</head>
<body>
    <div class="top-bar"><i class="fa-solid fa-truck-fast"></i> شحن سريع لجميع المناطق | دفع آمن | خصوصية تامة</div>
    <header>
        <div class="header-right">
            <div class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></div>
            <div onclick="showPage('home')" style="cursor:pointer; text-align:center;"><div class="logo-text">B</div><span class="logo-sub">بوتيك السعادة</span></div>
        </div>
        <div class="header-left">
            <div onclick="showPage('search')" style="cursor:pointer;"><i class="fa-solid fa-magnifying-glass"></i></div>
            <div onclick="showPage('cart')" class="cart-icon"><i class="fa-solid fa-cart-shopping"></i><span class="cart-badge" id="cartBadge">0</span></div>
        </div>
    </header>

    <div class="side-menu-overlay" onclick="toggleMenu()"></div>
    <div class="side-menu"><h3>أقسام المتجر</h3><ul id="sideMenuCategories"></ul></div>

    <div id="page-home" class="page-section active">
        <div class="dynamic-banner-container" id="dynamicBannerHome"></div>
        <div class="container mt-3"><h2 style="color:var(--gold); font-size:16px; margin-bottom:10px;">تسوق حسب القسم</h2><div class="categories-grid" id="homeCategories" style="padding:0;"></div></div>
        <div class="container mt-3 mb-3"><h2 style="color:var(--gold); font-size:16px; margin-bottom:10px;">المنتجات</h2><div class="products-grid" id="homeBestSellers" style="padding:0;"></div></div>
    </div>
    <div id="page-shop" class="page-section"><div class="products-grid" id="shopAllProducts"></div></div>
    <div id="page-cart" class="page-section"><div class="container mt-3" id="cartItemsContainer"></div><div class="container mt-3 mb-3" id="cartSummaryContainer"></div></div>
    <div id="page-product" class="page-section"><div class="container mt-3" id="productDetailsContainer"></div></div>
    <div id="page-account" class="page-section"><div class="menu-list mt-3"><div class="menu-item" onclick="showPage('wishlist')"><h4>المفضلة</h4></div></div></div>
    <div id="page-wishlist" class="page-section"><div class="container mt-3" id="wishlistItemsContainer"></div></div>
    <div id="page-search" class="page-section"><div class="container mt-3"><input type="text" id="searchInput" placeholder="ابحث..." oninput="performSearch()" style="width:100%; padding:15px; border-radius:50px; background:var(--bg-card); border:1px solid var(--gold); color:white;"></div><div class="products-grid" id="searchResults"></div></div>

    <div class="bottom-nav">
        <div class="nav-item active" id="nav-home" onclick="showPage('home')"><i class="fa-solid fa-house"></i>الرئيسية</div>
        <div class="nav-item" id="nav-shop" onclick="showPage('shop')"><i class="fa-solid fa-bag-shopping"></i>المنتجات</div>
        <div class="nav-item" id="nav-wishlist" onclick="showPage('wishlist')"><i class="fa-regular fa-heart"></i>المفضلة</div>
        <div class="nav-item" id="nav-account" onclick="showPage('account')"><i class="fa-regular fa-user"></i>حسابي</div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBPW_K2Kw-VARAQHPsSLT53Y0wPzxC6ATM", authDomain: "boutique-saada.firebaseapp.com", projectId: "boutique-saada", storageBucket: "boutique-saada.firebasestorage.app", messagingSenderId: "812086015531", appId: "1:812086015531:web:70c6a4e0e0402659161c6e" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let products = []; let categories = [];
        let cart = JSON.parse(localStorage.getItem('boutiqueCart')) || [];
        let wishlist = JSON.parse(localStorage.getItem('boutiqueWishlist')) || [];

        function showPage(pageId) {
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const nav = document.getElementById('nav-' + pageId); if(nav) nav.classList.add('active');
            document.querySelector('.side-menu').classList.remove('active'); document.querySelector('.side-menu-overlay').classList.remove('active');
            if(pageId === 'cart') renderCart(); if(pageId === 'wishlist') renderWishlist();
        }
        function toggleMenu() { document.querySelector('.side-menu').classList.toggle('active'); document.querySelector('.side-menu-overlay').classList.toggle('active'); }
        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

        // تحميل سريع وآمن
        async function loadData() {
            try {
                const catSnap = await db.collection("categories").get();
                categories = catSnap.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(c => c.status === 'active');
                document.getElementById('homeCategories').innerHTML = categories.map(cat => `<div class="category-item"><div class="category-icon"><img src="${cat.image || 'https://via.placeholder.com/75'}"></div><h4>${cat.name}</h4></div>`).join('');
                document.getElementById('sideMenuCategories').innerHTML = categories.map(c => `<li>${c.name}</li>`).join('');

                const prodSnap = await db.collection("products").get();
                products = prodSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                document.getElementById('homeBestSellers').innerHTML = products.slice(0, 4).map(createProductCard).join('');
                document.getElementById('shopAllProducts').innerHTML = products.map(createProductCard).join('');
            } catch(err) { console.log(err); }
        }

        function createProductCard(p) {
            return `<div class="product-card" onclick="openProductDetails('${p.id}')"><div class="product-img"><img src="${p.image || 'https://via.placeholder.com/160'}"></div><div class="product-info"><h4>${p.name}</h4><div class="stars">★★★★★</div><div class="price">${p.price} ريال</div></div><div class="product-actions"><button class="btn-add" onclick="event.stopPropagation(); addToCart('${p.id}')">أضف</button><button class="btn-buy" onclick="event.stopPropagation(); addToCart('${p.id}'); showPage('cart');">اطلب</button></div></div>`;
        }

        function addToCart(id) {
            const p = products.find(x => x.id === id); if(!p) return;
            const ex = cart.find(i => i.id === id);
            if(ex) ex.qty++; else cart.push({ id: p.id, name: p.name, price: p.price, image: p.image, qty: 1 });
            localStorage.setItem('boutiqueCart', JSON.stringify(cart));
            document.getElementById('cartBadge').textContent = cart.reduce((s, i) => s + i.qty, 0);
            showToast('✅ تمت الإضافة');
        }

        function renderCart() {
            const container = document.getElementById('cartItemsContainer');
            if(cart.length === 0) { container.innerHTML = 'السلة فارغة'; return; }
            let total = 0;
            container.innerHTML = cart.map(item => { total += item.price * item.qty; return `<div class="cart-item"><img src="${item.image}"><div class="cart-item-info"><h4>${item.name}</h4><p>${item.price} ريال</p></div></div>`; }).join('');
            document.getElementById('cartSummaryContainer').innerHTML = `<div style="background:var(--bg-card); border:1px solid var(--gold); border-radius:12px; padding:20px;"><h3 style="color:var(--gold); margin-bottom:10px;">المجموع: ${total} ريال</h3></div>`;
        }

        function openProductDetails(id) {
            const p = products.find(x => x.id === id); if(!p) return;
            document.getElementById('productDetailsContainer').innerHTML = `<div class="product-card"><div class="product-img" style="height:300px"><img src="${p.image}"></div><div class="product-info"><h2>${p.name}</h2><div class="price" style="font-size:22px">${p.price} ريال</div></div></div>`;
            showPage('product');
        }

        window.onload = function() { document.getElementById('cartBadge').textContent = cart.reduce((s, i) => s + i.qty, 0); loadData(); };
    </script>
</body>
</html>
